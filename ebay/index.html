<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCRED BOOKS ON EBAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#14171c;--panel:#1d2128;--line:#4a5260;--ink:#f4f6f8;--mute:#aab2bf;--up:#34e39a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:clamp(24px,4vw,56px) max(5vw,16px);text-align:center}
.home{display:inline-block;color:var(--mute);text-decoration:none;font-weight:600;margin-bottom:16px}
.home:hover{color:var(--ink)}
h1{font:700 clamp(30px,6vw,48px)/1.05 "Space Grotesk",Inter,sans-serif;margin:0 0 20px}
.btn{display:inline-block;font:700 16px/1 "Space Grotesk",Inter,sans-serif;letter-spacing:.06em;text-decoration:none;color:#14171c;background:var(--up);border:2px solid var(--ink);border-radius:10px;padding:14px 20px}
.btn:focus-visible,.card a:focus-visible{outline:3px solid var(--up);outline-offset:3px}
.top{margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;text-align:left}
.card{display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.ph{aspect-ratio:1;background:#2a2f38;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain;background:#2a2f38}
.body{display:flex;flex-direction:column;gap:14px;padding:16px;flex:1}
.t{font-weight:600;margin:0;flex:1}
.card .btn{text-align:center;font-size:15px;padding:12px 16px}
</style></head><body>
<main>
<a class="home" href="../">PCRED BOOKS</a>
<h1>PCRED BOOKS ON EBAY</h1>
<div class="top"><a class="btn" href="https://www.ebay.com/usr/pcred" target="_blank" rel="noopener">SEE EVERYTHING</a></div>
<div class="grid" id="g"></div>
</main>
<script>
{
const ITEMS=[
["356807821323","z9oAAOSw0Pdmz4Ke","jpg","Office Plastic Brown 6 Compartment Standing File Organizer Holder 6 * 7 * 8 Inch"],
["356812829129","NYEAAOSw2zViWwlF","jpg","THE RED WHEEL SERIES: AUGUST 1914 by ALEXANDER SOLZHENITZYZ, FARRAR 1972 VG HB"],
["356812824774","GwkAAOSw2sRmI7on","jpg","ICEBOUND: THE JEANNETTE EXPEDITION'S QUEST FOR THE NORTH By Leonard F. Guttridge"],
["820380905665","No8AAeSwJc9q6jjA","jpg","4 Tacoma Center Caps"],
["358052455248","m44AAeSwlX9oHPeZ","jpg","THE STARCLEANER REUNION by Cooper Eden - 1st Printing 1979 - Good"],
["358052451279","HHQAAOSwcltoVXM2","jpg","1997 \"NO WAY OUT\" TOUR BOOK BY PUFF DADDY – THE LOX, LIL' KIM, MASE – VG - SWEET"],
["357335193038","40EAAOSwEzJiucSB","png","THE UNABRIDGED JAMES DEAN - BY RANDALL RIESE - WINGED BOOKS - 1994 - VG"],
["357322887358","NS4AAOSwyKZnT0wn","jpg","Peanuts: a Golden Celebration : The Art and the Story of the World's Best-Loved"]
];
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.getElementById("g").innerHTML=ITEMS.map(([id,img,ext,t])=>`<article class="card">
<div class="ph"><img src="https://i.ebayimg.com/images/g/${img}/s-l500.${ext}" alt="${esc(t)}" loading="lazy"></div>
<div class="body"><p class="t">${esc(t)}</p>
<a class="btn" href="https://www.ebay.com/itm/${id}" target="_blank" rel="noopener">VIEW ON EBAY</a></div></article>`).join("");
}
</script>
</body></html>
